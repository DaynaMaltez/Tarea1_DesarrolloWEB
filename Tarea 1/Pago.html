<h1>Modulo de pago</h1>

<h4> Ingresa tus datos de pago para completar la compra. Asegúrate de que la información sea correcta antes de enviar el formulario.</h4>

  <label for="nombre">Nombre en la tarjeta:</label>

  <input type="text" id="numero" name="numero" required><br><br>

  <label for="fecha">Fecha de vencimiento (MM/AA):</label>
  <input type="text" id="fecha" name="fecha" required><br><br>
